l_english:
 chg_found_hegemony_decision:0 "Found a New Hegemony"
 chg_found_hegemony_decision_desc:0 "I will create a Hegemony to outshine all others, and to outlast history itself."
 chg_found_hegemony_decision_tooltip:0 "Found an entirely new [hegemony|E] [title|E]"
 chg_found_hegemony_decision_confirm:0 "$found_empire_decision_confirm$"
 chg_three_empires_held_tt:0 "You personally hold at least #V 3#! landed [empire|E] titles #weak ([GetPlayer.MakeScope.ScriptValue('chg_held_empire_count_value')|V0]/3)#!"
 chg_two_empires_held_tt:0 "You personally hold at least #V 2#! landed [empire|E] titles #weak ([GetPlayer.MakeScope.ScriptValue('chg_held_empire_count_value')|V0]/2)#!"
 chg_primary_empire_tt:0 "Your [primary_title|E] is a landed [empire|E] title"
 chg_no_ceremonial_liege_tt:0 "Your realm has no active ceremonial liege; founding a hegemony would dissolve that ceremonial institution"
 chg_create_title_tt:0 "You gain a new [hegemony|E] as your [primary_title|E]"
 chg_inherit_identity_tt:0 "The new title takes the base name, coat of arms, map color and de jure capital of your current primary empire"
 chg_held_empires_tt:0 "All landed [empire|E] titles you personally hold become [de_jure|E] part of the new hegemony"
 chg_uncreated_empires_tt:0 "Uncreated empires whose de jure territory you completely control also become part of the hegemony"
 chg_keep_empires_tt:0 "You keep your existing empire titles"
 chg.0001.t:0 "$major_decisions.1101.t$"
 chg.0001.desc:0 "All my life I have worked for this. To call my vassals and make them swear fealty anew.\n\nNow and forever, they will pay homage to me not only as their liege, but as [ROOT.Char.GetTitleAsNameNoTooltip]! [ROOT.Char.GetTitleAsNameNoTooltip] of [chg_new_hegemony.GetNameNoTier]!"
 chg.0001.a:0 "[chg_new_hegemony.GetNameNoTierNoTooltip] reigns supreme!"
