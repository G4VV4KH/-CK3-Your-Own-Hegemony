l_korean:
 chg_found_hegemony_decision:0 "새로운 패권국 수립"
 chg_found_hegemony_decision_desc:0 "그 어떤 패권국보다도 우월하고 역사에 길이 남을 패권국을 이룩할 것이다."
 chg_found_hegemony_decision_tooltip:0 "완전히 새로운 [hegemony|E] [title|E] 창설"
 chg_found_hegemony_decision_confirm:0 "$found_empire_decision_confirm$"
 chg_three_empires_held_tt:0 "영지가 있는 [empire|E] 작위를 직접 #V 3#!개 이상 보유함 #weak ([GetPlayer.MakeScope.ScriptValue('chg_held_empire_count_value')|V0]/3)#!"
 chg_two_empires_held_tt:0 "영지가 있는 [empire|E] 작위를 직접 #V 2#!개 이상 보유함 #weak ([GetPlayer.MakeScope.ScriptValue('chg_held_empire_count_value')|V0]/2)#!"
 chg_primary_empire_tt:0 "당신의 [primary_title|E]가 영지가 있는 [empire|E] 작위임"
 chg_no_ceremonial_liege_tt:0 "당신의 봉역에 재위 중인 의례적 군주가 없음. 패권국을 수립하면 해당 의례 제도가 해체됨"
 chg_create_title_tt:0 "새로운 [hegemony|E]을 [primary_title|E]로 획득함"
 chg_inherit_identity_tt:0 "새로운 작위가 현재 대표 작위인 제국 작위의 기본 이름, 문장, 지도 색상, 관습 수도를 이어받음"
 chg_held_empires_tt:0 "영지가 있는 [empire|E] 작위 중 당신이 직접 보유한 모든 작위가 새로운 패권국의 [de_jure|E]에 편입됨"
 chg_uncreated_empires_tt:0 "규범 권역을 완전히 지배하고 있는 미창설 제국 역시 패권국에 편입됨"
 chg_keep_empires_tt:0 "기존 제국 작위를 유지함"
 chg.0001.t:0 "$major_decisions.1101.t$"
 chg.0001.desc:0 "내 평생은 이날을 위해서 바쳐온 것이었다. 그리하여 봉신을 모두 모아 새로이 충성을 맹세하게 했다.\n\n이제 그들은 나에게 평생 존경을 다 바칠 것이다. 주군으로서뿐만 아니라 [ROOT.Char.GetTitleAsNameNoTooltip](으)로서도 말이다! [chg_new_hegemony.GetNameNoTier]의 [ROOT.Char.GetTitleAsNameNoTooltip](으)로 말이야!"
 chg.0001.a:0 "[chg_new_hegemony.GetNameNoTierNoTooltip](이)가 정점에 군림하노라! "
