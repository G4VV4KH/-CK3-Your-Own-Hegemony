 chg.0001.t:0 "$major_decisions.1101.t$"
 chg.0001.desc:0 "Praca nad tym, by moi wasale stawili się przede mną i na nowo ślubowali mi wierność, to dzieło całego mojego życia.\n\nOd teraz już zawsze będą składać mi hołd, lecz nie tylko jako swemu seniorowi. Jam jest [ROOT.Char.GetTitleAsNameNoTooltip]! [ROOT.Char.GetTitleAsNameNoTooltip] ziem o nazwie [chg_new_hegemony.GetNameNoTier]!"
 chg.0001.a:0 "[chg_new_hegemony.GetNameNoTierNoTooltip] to najpotężniejsze ziemie!"
