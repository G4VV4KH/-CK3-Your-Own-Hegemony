l_german:
 chg_found_hegemony_decision:0 "Eine neue Hegemonie gründen"
 chg_found_hegemony_decision_desc:0 "Ich werde eine Hegemonie erschaffen, die heller leuchtet als alle anderen und die die Geschichte selbst überdauern wird."
 chg_found_hegemony_decision_tooltip:0 "Gründet einen völlig neuen [hegemony|E]-[title|E]"
 chg_found_hegemony_decision_confirm:0 "$found_empire_decision_confirm$"
 chg_three_empires_held_tt:0 "Ihr besitzt persönlich mindestens #V 3#! landbesitzende [empire|E]-Titel #weak ([GetPlayer.MakeScope.ScriptValue('chg_held_empire_count_value')|V0]/3)#!"
 chg_two_empires_held_tt:0 "Ihr besitzt persönlich mindestens #V 2#! landbesitzende [empire|E]-Titel #weak ([GetPlayer.MakeScope.ScriptValue('chg_held_empire_count_value')|V0]/2)#!"
 chg_primary_empire_tt:0 "Euer [primary_title|E] ist ein landbesitzender [empire|E]-Titel"
 chg_no_ceremonial_liege_tt:0 "Euer Reich hat keinen amtierenden Zeremonienmonarchen; die Gründung einer Hegemonie würde diese Institution auflösen"
 chg_create_title_tt:0 "Ihr erhaltet eine neue [hegemony|E] als Euren [primary_title|E]"
 chg_inherit_identity_tt:0 "Der neue Titel übernimmt den Grundnamen, das Wappen, die Kartenfarbe und die De-jure-Hauptstadt Eures derzeitigen primären Großreichs"
 chg_held_empires_tt:0 "Alle landbesitzenden [empire|E]-Titel in Eurem persönlichen Besitz werden [de_jure|E]-Teile der neuen Hegemonie"
 chg_uncreated_empires_tt:0 "Nicht erschaffene Großreiche, deren De-jure-Gebiet Ihr vollständig kontrolliert, werden ebenfalls Teil der Hegemonie"
 chg_keep_empires_tt:0 "Ihr behaltet Eure bestehenden Großreichstitel"
 chg.0001.t:0 "$major_decisions.1101.t$"
 chg.0001.desc:0 "Mein ganzes Leben habe ich darauf hingearbeitet: meine Vasallen zu mir zu rufen, auf dass sie mir von Neuem die Treue schwören.\n\nJetzt und für immerdar werde ich nicht nur Lehnsherr für sie sein, nein, sondern [ROOT.Char.GetTitleAsNameNoTooltip]! [ROOT.Char.GetTitleAsNameNoTooltip] von [chg_new_hegemony.GetNameNoTier]!"
 chg.0001.a:0 "[chg_new_hegemony.GetNameNoTierNoTooltip] herrscht über allem!"
