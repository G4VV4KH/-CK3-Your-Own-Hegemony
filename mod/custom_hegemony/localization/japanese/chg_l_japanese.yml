l_japanese:
 chg_found_hegemony_decision:0 "新たな覇権国を建国する"
 chg_found_hegemony_decision_desc:0 "私はすべての覇権国をしのぐ輝きを放つ覇権国を作る。この覇権国は歴史それ自体よりも長く続くことだろう。"
 chg_found_hegemony_decision_tooltip:0 "全く新しい[hegemony|E]の[title|E]が創設される"
 chg_found_hegemony_decision_confirm:0 "$found_empire_decision_confirm$"
 chg_three_empires_held_tt:0 "領地を伴う[empire|E]の称号を自ら#V 3#!つ以上保有している #weak ([GetPlayer.MakeScope.ScriptValue('chg_held_empire_count_value')|V0]/3)#!"
 chg_two_empires_held_tt:0 "領地を伴う[empire|E]の称号を自ら#V 2#!つ以上保有している #weak ([GetPlayer.MakeScope.ScriptValue('chg_held_empire_count_value')|V0]/2)#!"
 chg_primary_empire_tt:0 "あなたの[primary_title|E]が、領地を伴う[empire|E]の称号である"
 chg_no_ceremonial_liege_tt:0 "あなたの領国に現職の儀礼的な君主がいない。覇権国を建国すると、その儀礼的な制度は廃止される"
 chg_create_title_tt:0 "新たな[hegemony|E]を[primary_title|E]として獲得する"
 chg_inherit_identity_tt:0 "新たな称号は、現在の主要な帝国称号から基本名称、紋章、地図上の色、慣習的首都を引き継ぐ"
 chg_held_empires_tt:0 "あなた自身が保有する、領地を伴うすべての[empire|E]が、新たな覇権国の[de_jure|E]な領土となる"
 chg_uncreated_empires_tt:0 "慣習的領土を完全に支配している未創設の帝国も、覇権国の一部となる"
 chg_keep_empires_tt:0 "既存の帝国称号は引き続き保有する"
 chg.0001.t:0 "$major_decisions.1101.t$"
 chg.0001.desc:0 "私は人生を掛けて、この時のために働いてきたのだ。家臣を呼び、改めて忠誠を誓わせる。\n\nこれからは、彼らは私を主君としてだけではなく、[ROOT.Char.GetTitleAsNameNoTooltip]としても敬うことになるのだ！ [chg_new_hegemony.GetNameNoTier]の[ROOT.Char.GetTitleAsNameNoTooltip]として！"
 chg.0001.a:0 "[chg_new_hegemony.GetNameNoTierNoTooltip]がここに君臨する！"
