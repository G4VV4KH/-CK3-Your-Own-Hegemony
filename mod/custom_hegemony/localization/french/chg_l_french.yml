l_french:
 chg_found_hegemony_decision:0 "Fonder une nouvelle hégémonie"
 chg_found_hegemony_decision_desc:0 "Je créerai une hégémonie qui surpassera toutes les autres et survivra à notre époque."
 chg_found_hegemony_decision_tooltip:0 "Créer un tout nouveau [title|El] d’[hegemony|El]"
 chg_found_hegemony_decision_confirm:0 "$found_empire_decision_confirm$"
 chg_three_empires_held_tt:0 "Vous possédez personnellement au moins #V 3#! titres d’[empire|El] dotés de terres #weak ([GetPlayer.MakeScope.ScriptValue('chg_held_empire_count_value')|V0]/3)#!"
 chg_two_empires_held_tt:0 "Vous possédez personnellement au moins #V 2#! titres d’[empire|El] dotés de terres #weak ([GetPlayer.MakeScope.ScriptValue('chg_held_empire_count_value')|V0]/2)#!"
 chg_primary_empire_tt:0 "Votre [primary_title|El] est un titre d’[empire|El] doté de terres"
 chg_no_ceremonial_liege_tt:0 "Votre pays n’a pas de monarque symbolique en fonction ; fonder une hégémonie dissoudrait cette institution"
 chg_create_title_tt:0 "Vous obtenez une nouvelle [hegemony|El] comme [primary_title|El]"
 chg_inherit_identity_tt:0 "Le nouveau titre reprend le nom de base, les armoiries, la couleur sur la carte et la capitale de jure de votre empire principal actuel"
 chg_held_empires_tt:0 "Tous les titres d’[empire|El] dotés de terres que vous possédez personnellement font désormais partie [de_jure|El] de la nouvelle hégémonie"
 chg_uncreated_empires_tt:0 "Les empires non créés dont vous contrôlez entièrement le territoire de jure font également partie de l’hégémonie"
 chg_keep_empires_tt:0 "Vous conservez vos titres impériaux existants"
 chg.0001.t:0 "$major_decisions.1101.t$"
 chg.0001.desc:0 "Toute ma vie j’ai œuvré dans ce but. Appeler mes vassaux et leur faire jurer fidélité.\n\nMaintenant et pour toujours, ils me rendront hommage non seulement en tant que leur [ROOT.Char.Custom('FR_SeigneurDame')] lige, mais aussi en tant que [ROOT.Char.GetTitleAsNameNoTooltip] de [chg_new_hegemony.GetNameNoTier] !"
 chg.0001.a:0 "[chg_new_hegemony.GetNameNoTierNoTooltip] règne en maître !"

 rule_chg_hegemony_creation:0 "Création d’hégémonies personnalisées"
 setting_chg_hegemony_everyone:0 "Tout le monde"
 setting_chg_hegemony_everyone_desc:0 "La décision de fonder une hégémonie personnalisée est accessible aux dirigeants contrôlés par les joueurs et par l’IA. Toutes les autres conditions restent applicables."
 setting_chg_hegemony_players_only:0 "Joueurs uniquement"
 setting_chg_hegemony_players_only_desc:0 "La décision de fonder une hégémonie personnalisée est réservée aux dirigeants contrôlés par les joueurs. Toutes les autres conditions restent applicables."
 setting_chg_hegemony_ai_only:0 "IA uniquement"
 setting_chg_hegemony_ai_only_desc:0 "La décision de fonder une hégémonie personnalisée est réservée aux dirigeants contrôlés par l’IA. Toutes les autres conditions restent applicables."
 setting_chg_hegemony_nobody:0 "Personne"
 setting_chg_hegemony_nobody_desc:0 "La décision de fonder une hégémonie personnalisée n’est accessible à aucun dirigeant."
